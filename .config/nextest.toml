[test-groups]
heavy-integration = { max-threads = 2 }
# Multi-daemon fleet suites (ADR 0037): each test boots 3-5 in-process
# coordinator daemons with 300ms election timeouts, and nextest runs every
# test in its own process — so any in-binary serialization is invisible here.
# Concurrent fleets starve each other's runtimes on small (CI) hosts into
# election churn: joiners then loop on 503s until their deadlines lapse.
# One fleet at a time is the point, not a throughput tweak.
fleet-serial = { max-threads = 1 }

# Ordinary local runs exclude the heavy integration binaries and the
# multi-daemon fleet suites; `--profile heavy` opts back in.
[profile.default]
default-filter = '''
not (
    binary(cluster)
    | binary(agent_protocol)
    | binary(submit_retry)
    | binary(job_logs)
    | binary(job_metrics)
    | binary(docker_executor)
    | test(openraft_storage_compliance)
    | binary(formation)
    | binary(convergence)
    | binary(admin_membership)
    | binary(replace_voter)
    | binary(key_custody)
    | binary(evidence_removal)
    | binary(address_move)
)
'''

# Assign the heavy tests to the rate-limited group.
#
# Custom profiles inherit from profile.default, including its overrides, so this
# applies to the default, ci, and heavy profiles.
[[profile.default.overrides]]
filter = '''
binary(agent_protocol)
| binary(submit_retry)
| binary(job_logs)
| binary(job_metrics)
| binary(docker_executor)
| test(openraft_storage_compliance)
'''
test-group = 'heavy-integration'

[[profile.default.overrides]]
filter = '''
binary(cluster)
| binary(formation)
| binary(convergence)
| binary(admin_membership)
| binary(replace_voter)
| binary(key_custody)
| binary(evidence_removal)
| binary(address_move)
'''
test-group = 'fleet-serial'

# CI runs the complete suite, but the fleet-serial suites are carved out into
# the ci-fleet-* shard profiles below: fleet-serial runs one test at a time
# (see the group comment above), so its wall time is the *sum* of every fleet
# test — ~6.5 minutes if a single job runs them all. Each shard instead runs
# its suites on its own CI host (still one fleet at a time per host), and the
# shards are balanced by measured suite duration. A binary excluded here must
# appear in exactly one ci-fleet-* profile or CI silently skips it —
# scripts/check-fleet-shards.sh enforces that partition on every CI run.
[profile.ci]
default-filter = '''
not (
    binary(cluster)
    | binary(formation)
    | binary(convergence)
    | binary(admin_membership)
    | binary(replace_voter)
    | binary(key_custody)
    | binary(evidence_removal)
    | binary(address_move)
)
'''
fail-fast = false

[profile.ci-fleet-1]
default-filter = 'binary(cluster) | binary(convergence)'
fail-fast = false

[profile.ci-fleet-2]
default-filter = 'binary(evidence_removal) | binary(replace_voter)'
fail-fast = false

[profile.ci-fleet-3]
default-filter = '''
binary(key_custody)
| binary(formation)
| binary(admin_membership)
| binary(address_move)
'''
fail-fast = false

# The whole suite in one run — what CI's {ci, ci-fleet-*} jobs add up to.
# The profile to reach for when reproducing CI behavior in a single run.
[profile.ci-full]
default-filter = 'all()'
fail-fast = false

# Convenient opt-in profile for humans: run only the heavy tests.
[profile.heavy]
default-filter = '''
binary(cluster)
| binary(agent_protocol)
| binary(submit_retry)
| binary(job_logs)
| binary(job_metrics)
| binary(docker_executor)
| test(openraft_storage_compliance)
| binary(formation)
| binary(convergence)
| binary(admin_membership)
| binary(replace_voter)
| binary(key_custody)
| binary(evidence_removal)
| binary(address_move)
'''
