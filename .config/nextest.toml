[test-groups]
heavy-integration = { max-threads = 2 }
# Multi-daemon fleet suites (ADR 0037): each test boots 3-5 in-process
# coordinator daemons with 300ms election timeouts, and nextest runs every
# test in its own process — so any in-binary serialization is invisible here.
# Concurrent fleets starve each other's runtimes on small (CI) hosts into
# election churn: joiners then loop on 503s until their deadlines lapse.
# One fleet at a time is the point, not a throughput tweak.
fleet-serial = { max-threads = 1 }

# Ordinary local runs exclude the heavy integration binaries.
[profile.default]
default-filter = '''
not (
    binary(cluster)
    | binary(agent_protocol)
    | binary(submit_retry)
    | binary(job_logs)
    | binary(job_metrics)
    | binary(docker_executor)
    | test(openraft_storage_compliance)
)
'''

# Assign the heavy tests to the rate-limited group.
#
# Custom profiles inherit from profile.default, including its overrides, so this
# applies to the default, ci, and heavy profiles.
[[profile.default.overrides]]
filter = '''
binary(agent_protocol)
| binary(submit_retry)
| binary(job_logs)
| binary(job_metrics)
| binary(docker_executor)
| test(openraft_storage_compliance)
'''
test-group = 'heavy-integration'

[[profile.default.overrides]]
filter = '''
binary(cluster)
| binary(formation)
| binary(convergence)
| binary(admin_membership)
| binary(replace_voter)
| binary(key_custody)
| binary(evidence_removal)
| binary(address_move)
'''
test-group = 'fleet-serial'

# CI runs the complete test suite.
[profile.ci]
default-filter = 'all()'
fail-fast = false

# Convenient opt-in profile for humans: run only the heavy tests.
[profile.heavy]
default-filter = '''
binary(cluster)
| binary(agent_protocol)
| binary(submit_retry)
| binary(job_logs)
| binary(job_metrics)
| binary(docker_executor)
| test(openraft_storage_compliance)
'''
