[package]
name = "coppice-testkit"
description = "Test and bench infrastructure: SimFs fault injection, the crash harness, and synthetic state generation. Dev-dependency only; never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
coppice-consensus.workspace = true
coppice-core.workspace = true
coppice-state.workspace = true
crc32c.workspace = true
imbl.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# For building typed ids deterministically from the testkit Rng — never
# `Uuid::new_v4` in the generator, or seeds stop reproducing.
uuid.workspace = true
# For `oidc::FakeIdp`: a real HTTP server (axum/tokio) minting real ES256
# JWTs (jsonwebtoken) over a hand-built JWKS (rcgen for the EC keypairs,
# base64 for the JWK's x/y coordinates, serde_json for the token claims and
# discovery/JWKS bodies) — so `coppice-authn`'s validator is exercised
# against a real key rollover and real signature checks, not stubs.
axum.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
rcgen.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
