[package]
name = "coppice-api"
description = "External API layer: submission, queries, subscriptions, and admin endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum.workspace = true
# The authentication edge (ADR 0022): this crate owns the axum seam
# (`http::authn`) and nothing else — the chain, the JWKS cache and the token
# validator live there, constructed by the coordinator and injected here.
coppice-authn.workspace = true
coppice-core.workspace = true
# The `/enroll` wire contract (ADR 0037 §4). The DTOs are defined once, in the
# crate both this server and the enrolling daemons depend on, so the two halves
# cannot drift.
coppice-enroll.workspace = true
# The read-model projections serve the scheduler's `projected_ready` bounds
# (`AccrualView::projected_start`): recomputed at read time through the same
# sweep the scheduling pass uses, so job and node views cannot drift from
# scheduler semantics (ADR 0027).
coppice-scheduler.workspace = true
coppice-state.workspace = true
# The `/metrics` endpoint (issue #46): renders the process's Prometheus
# recorder. The facade for the same, so the test-only local recorder can be
# built without a global install.
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mime_guess.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `/enroll`'s concurrency cap is a `tokio::sync::Semaphore` (ADR 0037 §4
# ingress hardening); the rest of the crate stays runtime-agnostic.
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The fake IdP (`coppice_testkit::oidc`) the middleware's bearer tests mint
# real tokens from, and the PKI the operator-certificate tests mint a root CA
# and an operator leaf with.
coppice-testkit.workspace = true
coppice-tls.workspace = true
rustls-pemfile.workspace = true
tokio.workspace = true
tower.workspace = true

[lints]
workspace = true
