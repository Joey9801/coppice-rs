[package]
name = "coppice-state"
description = "Deterministic replicated state machine for the Coppice control plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
coppice-core.workspace = true
imbl.workspace = true
thiserror.workspace = true
# `CaCertBundle` validation (ADR 0037 §4): every PEM block is base64-decoded
# and DER-parsed as a real X.509 CA certificate before it can enter the Raft
# log — a private key relabeled `CERTIFICATE` must not pass.
base64.workspace = true
x509-parser.workspace = true

[dev-dependencies]
# Real CA/leaf/key material for the CaCertBundle validation tests.
rcgen.workspace = true
# Dev-only cycle: the determinism harness roundtrips snapshots through the
# real proto record path.
coppice-proto.workspace = true
proptest.workspace = true
prost.workspace = true
uuid.workspace = true

[lints]
workspace = true
