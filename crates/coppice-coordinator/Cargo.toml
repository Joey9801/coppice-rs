[package]
name = "coppice-coordinator"
description = "Coordinator daemon: the replicated control plane binding consensus, scheduling, and the API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
coppice-core.workspace = true
coppice-proto.workspace = true
coppice-net.workspace = true
coppice-state.workspace = true
coppice-consensus.workspace = true
coppice-scheduler.workspace = true
coppice-api.workspace = true
# The `/enroll` wire contract (ADR 0037 §4): the response this coordinator
# hands back is the DTO both halves share.
coppice-enroll.workspace = true
# Hot-reloadable mTLS store (ADR 0037 §4): the connection-time acceptor for the
# two mTLS listeners and the shared material the raft mesh and node-fetch client
# dial with.
coppice-tls.workspace = true
anyhow.workspace = true
# The enrollment core's error type (ADR 0037 §4) is matched on by its callers
# to decide a status code, so it is a typed enum rather than an `anyhow` chain.
thiserror.workspace = true
# The fanout's `proposer_skew` histogram (ADR 0032), registered through the
# same describe/gather pattern as `coppice-consensus`.
metrics.workspace = true
# Installs the process-wide Prometheus recorder at startup and hands its
# handle to the `/metrics` endpoint on the client API listener (issue #46).
metrics-exporter-prometheus.workspace = true
# Serves the `coppice_api::http` router on the client listener (ADR 0031).
axum.workspace = true
# The client listener's TLS posture (ADR 0037 §4): `axum::serve` takes a bare
# TCP listener, so the TLS path accepts, handshakes with tokio-rustls, and
# hands each connection to hyper's auto (h2/http1) server over the same router.
hyper.workspace = true
hyper-util.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
clap.workspace = true
tokio.workspace = true
# Wraps the per-session outbound mpsc as a `Stream` for the tonic bidi
# response half of the agent session RPC (`coppice.agent.v1.AgentService`).
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
# `json` (not in the workspace default feature set) backs the config's
# `log_format = "json"` structured-logging option; mirrors the `uuid` pattern
# below of enabling a feature purely from this crate.
tracing-subscriber = { workspace = true, features = ["json"] }
serde.workspace = true
# The local admin socket's line-delimited JSON framing (ADR 0037 §3), and the
# `/readyz` document it returns verbatim for the `status` verb.
serde_json.workspace = true
toml.workspace = true
humantime-serde.workspace = true
uuid.workspace = true
# The admin socket's directory ownership check (ADR 0037 §3): binding to an
# operator-chosen directory requires proving it is owner-only and ours —
# `geteuid` against the directory's stat — because socket access IS the
# authority on that surface.
nix.workspace = true
# Coordinator discovery (ADR 0037 §2): the `dns` backend resolves candidate
# raft addresses (A/AAAA + SRV) once per consultation.
hickory-resolver.workspace = true
# The `advertise_host` fallback chain reads the OS hostname when unset (ADR 0037).
gethostname.workspace = true
# The `ec2-asg` discovery backend (ADR 0037 §2): IMDSv2 for this instance's
# id/region, Auto Scaling for group membership, EC2 for private IPs. Confined to
# `discovery::ec2_asg` behind the internal `AsgApi` seam.
aws-config.workspace = true
aws-sdk-ec2.workspace = true
aws-sdk-autoscaling.workspace = true
# Parses the agent's mTLS client-leaf certificate to enforce CN == NodeId at
# session accept (ADR 0011); see `tasks::agent_gateway`. Also splits the
# replicated CA bundle into its roots for `rotate-ca` (ADR 0037 §4).
# The convergence loop's public-edge supersession probe (ADR 0037 §3): a
# `GET /readyz` against the `[enrollment]` endpoint, under the same
# system-roots posture the enrollment client uses. It is the only plane that
# still answers across the trust-root discontinuity a re-init creates, which is
# what makes it the channel that can see a superseded history at all.
reqwest.workspace = true
x509-parser.workspace = true
# Splits the replicated CA bundle into per-certificate DER for the re-root
# verb's inspection surface (`rotate`), using the same parser the TLS stores do.
rustls-pemfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `start_paused` virtual time for the derived-stats bucket-interval test.
tokio = { workspace = true, features = ["test-util"] }
# Test-only self-signed CA + per-node leaf certs for the mTLS Raft/admin mesh
# the multi-node integration test drives (ADR 0011). Dev-only: production nodes
# read PEM material from disk (config `[tls]`), never mint it.
rcgen.workspace = true
# The real node agent (lib): its `Session` runner, `FakeExecutor`, and journal
# drive the end-to-end agent↔coordinator reconciliation protocol test
# (`tests/agent_protocol.rs`) against the live coordinator runtime.
coppice-agent.workspace = true
# `serde_json` decodes JSON bodies and `bytes` builds the seeded `LogChunk`
# payloads for the best-effort job-log e2e test (`tests/job_logs.rs`, ADR 0034);
# `tower::ServiceExt::oneshot` drives the real axum router in-process there and
# is already a normal dependency above.
bytes.workspace = true
# (`reqwest` is a normal dependency above; the suites also drive the real client
# listener over the loopback for the ADR 0037 §9 `/readyz` gate and the
# closed-until-formed API surface, where an in-process `oneshot` against the
# router would not exercise the listener handover a parked daemon performs.)
# In-memory tracing capture for the ADR 0037 §4 assertion that an enrollment
# token secret never reaches a log line (`tests/enrollment_logging.rs`).
coppice-testkit.workspace = true

[lints]
workspace = true
