<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coppice</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      // Keep in sync with src/lib/theme.tsx (storage key + default dark).
      if (localStorage.getItem('coppice-theme') !== 'light') {
        document.documentElement.classList.add('dark')
      } else {
        document.querySelector('link[rel="icon"]').href = '/favicon-light.svg'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
