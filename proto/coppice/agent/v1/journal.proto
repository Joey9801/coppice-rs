// The agent's local durable journal (ADR 0009). Never on the wire: these
// records live only in the agent's data directory, written through the
// filesystem seam with the same crash-safety care as coordinator storage
// (fsync before container start).
//
// The journal plus the container runtime (queried by label) is what the
// agent trusts over its own memory: on restart it recovers these records,
// observes the runtime, and reports the full ObservedSet before accepting
// new work. Framing (length + CRC32C) is the storage engine's concern, not
// the schema's.

syntax = "proto3";

package coppice.agent.v1;

import "coppice/core/v1/attempt.proto";
import "coppice/core/v1/ids.proto";
import "coppice/core/v1/job.proto";

// One journal entry. Append-only; compaction rewrites the live set.
message JournalRecord {
  oneof body {
    FencingUpdate fencing = 1;
    StartIntent start_intent = 2;
    AllocationTombstone tombstone = 3;
    ObservedExit observed_exit = 4;
    NoticeIntent notice_intent = 5;
    NoticeMark notice_mark = 6;
    DrainPlan drain_plan = 7;
    DrainPlanRetired drain_plan_retired = 8;
  }
}

// The highest fencing token the agent has accepted (ADR 0009): journaled
// before acting on any command carrying a higher token, so a restarted
// agent never regresses to obeying a deposed leader. `command_seq` is
// deliberately absent — a restart re-registers, and the epoch bump
// invalidates the old sequence space.
message FencingUpdate {
  uint64 leader_term = 1;
  uint64 node_epoch = 2;
}

// Journaled durably *before* the container is started (ADR 0009): a running
// container always has a durable intent record, so recovery can never find
// work it cannot account for. Idempotency anchor for StartJob.
message StartIntent {
  coppice.core.v1.AllocationId allocation = 1;
  coppice.core.v1.AttemptId attempt = 2;
  coppice.core.v1.JobId job = 3;
  // The node epoch the StartJob was accepted under.
  uint64 node_epoch = 4;
  // The enforced runtime bound copied from StartJob.max_runtime_us (ADR 0014),
  // journaled so recovery can rebuild the max-runtime watchdog: the remaining
  // budget is this minus the runtime the container reports. Absent = unbounded.
  optional uint64 max_runtime_us = 5;
  // The notice contract and stop-path grace copied from StartJob (ADR 0044
  // §3), so recovery re-signals with the declared signal and runs the stop
  // path with the dispatched grace.
  coppice.core.v1.NoticeSignal notice_signal = 6;
  uint64 notice_us = 7;
  uint64 abort_grace_us = 8;
}

// A StopJob was accepted for this allocation (ADR 0013): journaled before
// acting so a racing or re-delivered StartJob is refused even across an
// agent restart. Valid for allocations the agent has never seen.
message AllocationTombstone {
  coppice.core.v1.AllocationId allocation = 1;
  // Which command wrote it, so a tombstone found on recovery resolves as
  // that command would have (ADR 0044 §3). Always written.
  TombstoneReason reason = 2;
}

message TombstoneReason {
  // A StopJob from the coordinator.
  message Abort {}
  // The agent's own stop path for a preemption, drain or interruption.
  message Preempt {
    coppice.core.v1.PreemptReason reason = 1;
  }

  oneof reason {
    Abort abort = 1;
    Preempt preempt = 2;
  }
}

// The platform asked this attempt to stop (ADR 0044 §3): journaled, fsynced,
// *before* the notice signal is delivered. The intent, not the mark, is the
// classifier: a non-zero exit of an allocation with an intent is Preempted.
message NoticeIntent {
  coppice.core.v1.AllocationId allocation = 1;
  coppice.core.v1.PreemptReason reason = 2;
}

// The notice signal was delivered (ADR 0044 §3): journaled after the signal,
// before it is reported. The latest mark per allocation is in force, and a
// replacement mark may only be earlier.
message NoticeMark {
  coppice.core.v1.AllocationId allocation = 1;
  // The attempt's stop time, agent wall-clock µs.
  int64 stop_at_us = 2;
  // Declared notice minus notice actually given; zero when none was lost.
  uint64 shortfall_us = 3;
  // When the signal was delivered, agent wall-clock µs: the start of the
  // workload's window, kept so a replacement mark can recompute the shortfall.
  int64 notified_at_us = 4;
}

// The node's active drain plan (ADR 0044 §5), so a restarted agent still
// runs it. The latest record is in force.
message DrainPlan {
  // The plan's deadline D, agent wall-clock µs.
  int64 deadline_us = 1;
  coppice.core.v1.PreemptReason reason = 2;
  // The accepted-work target of a deadline drain; unused until operator
  // deadline drains exist.
  optional int64 accepted_target_us = 3;
}

// The active drain plan is over (ADR 0044 §5): an interruption plan whose
// deadline had already passed when a restarted agent recovered it. The host
// came back (a `stop` reclaim, or a notice that never landed), so the node
// must not stay draining; compaction drops both records.
message DrainPlanRetired {}

// The container's exit was observed and classified (ADR 0013 taxonomy).
// Kept so a restarted agent's ObservedSet reports the honest outcome for
// work that ended while the report may not have reached the coordinator.
message ObservedExit {
  coppice.core.v1.AllocationId allocation = 1;
  coppice.core.v1.AttemptId attempt = 2;
  coppice.core.v1.JobId job = 3;
  coppice.core.v1.AttemptOutcome outcome = 4;
  uint64 runtime_us = 5;
}
