// Compute node model (mirrors `coppice_core::node`).

syntax = "proto3";

package coppice.core.v1;

import "coppice/core/v1/ids.proto";
import "coppice/core/v1/resource.proto";

// One label used for hard/soft placement constraints.
//
// Label sets are repeated entries, never a proto map: map serialization
// order is unspecified, and labels ride in replicated payloads. Canonical
// form: ascending byte-order by key, unique keys.
message Label {
  string key = 1;
  string value = 2;
}

// Authoritative record of a node's membership and drain state.
message Node {
  NodeId id = 1;
  // Total advertised capacity.
  Resources capacity = 2;
  // Canonical form: ascending key, unique keys.
  repeated Label labels = 3;
  // Was the ADR 0041 cordon flag; replaced by `drain` (ADR 0044 §5).
  reserved 4;
  reserved "schedulable";
  // Advertised `host:port` of the agent's `NodeService` listener (ADR 0034):
  // authoritative addressing lives in replicated membership, and readers dial
  // this to fetch job logs. Absent or empty means the agent hosts no service.
  optional string service_addr = 5;
  // What the agent's host looks like, reported at registration. Display-only:
  // no scheduling decision reads it. Absent when the agent reported none.
  optional HostFacts host_facts = 6;
  // What capacity *detection* read on that host before the agent's
  // `[capacity]` overrides applied. `capacity` above stays the authoritative
  // advertised vector; this is display-only context explaining a node that
  // advertises something other than its hardware. Absent when undetected.
  optional Resources detected_capacity = 7;
  // The node accepts only effectively preemptible work (ADR 0044 §4, spot
  // capacity), from the agent's `[preemption] preemptible_only`. Rewritten by
  // every registration, like capacity and labels.
  bool preemptible_only = 8;
  // The operator's drain (ADR 0044 §5); absent while the node is open.
  // Desired state owned by the admin — an agent restart must not undo a drain
  // (ADR 0009). A draining node admits only bounded backfill.
  Drain drain = 9;
}

// An operator's drain of one node (ADR 0044 §5). A regular drain (no
// deadline): existing work finishes naturally, and only bounded backfill
// guaranteed gone by the node's horizon is admitted. A deadline drain: the
// node must be empty by `deadline_us`; backfill is admitted up to T_notice,
// and what still runs then is notified and stopped at T_stop.
message Drain {
  // When the drain was first requested; a repeated drain keeps this stamp.
  int64 requested_at_us = 1;
  // The deadline D, µs. Absent for a regular drain.
  optional int64 deadline_us = 2;
}

// Static description of the machine an agent runs on, collected once at
// startup and refreshed only by re-registration.
//
// Every field is **best-effort and independently optional**: a reading the
// agent could not take is left at its zero value, which reads as "unknown"
// (empty string, zero count). Nothing here is authoritative — capacity is what
// `Node.capacity` advertises, and these facts only explain where that number
// came from. Deliberately flat: no NUMA topology, no per-device breakdown.
message HostFacts {
  // Operating system family, e.g. "linux", "macos" (`std::env::consts::OS`).
  string os = 1;
  // Human-readable OS release: `/etc/os-release`'s `PRETTY_NAME` on Linux,
  // `kern.osproductversion` on macOS.
  string os_version = 2;
  // Kernel release string (`uname -r`): `/proc/sys/kernel/osrelease` on Linux,
  // `kern.osrelease` on macOS.
  string kernel_version = 3;
  // CPU architecture, e.g. "x86_64", "aarch64" (`std::env::consts::ARCH`).
  string arch = 4;
  // Marketing name of the CPU: `/proc/cpuinfo`'s `model name` on Linux,
  // `machdep.cpu.brand_string` (falling back to `hw.model`) on macOS.
  string cpu_model = 5;
  // Physical cores, ignoring SMT siblings. Zero = not determined.
  uint32 physical_cores = 6;
  // Hardware threads the OS schedules on. Zero = not determined.
  uint32 logical_cores = 7;
  // Total installed RAM in bytes, the same reading capacity detection took.
  // Zero = not determined.
  uint64 total_memory_bytes = 8;
  // Total size of the filesystem holding the agent's data directory, in bytes
  // — the same reading capacity detection took. Zero = not determined.
  uint64 total_disk_bytes = 9;
  // The agent binary's own version (`CARGO_PKG_VERSION`), so a mixed-version
  // fleet is visible without dialing each node.
  string agent_version = 10;
}
