// Deterministic fixed-point quota vocabulary (mirrors `coppice_core::quota`
// and the ADR 0019 representation decisions).
//
// Nothing here is ever a float: cost and usage are u64 micro-cost-units
// (µCU), weights and multipliers are u64 Q32.32 fixed point, the decay
// factor is u64 Q0.64. Replicas must agree on these values bit-for-bit, and
// floating point cannot promise that across platforms and binary versions.
// Field names carry the unit and representation (`*_ucu`, `*_q32_32`,
// `*_q0_64`) so a reader can never mistake the encoding.

syntax = "proto3";

package coppice.core.v1;

import "coppice/core/v1/resource.proto";

// µCU per (resource unit × second) for one dimension, Q32.32.
message CostWeight {
  ResourceKind kind = 1;
  uint64 weight_q32_32 = 2;
}

// Replicated cost weights. New resource dimensions are priced by adding
// entries, not by changing the representation. Canonical form: ascending
// kind, unique kinds, zero weights omitted.
message CostWeights {
  repeated CostWeight weights = 1;
}

// Replicated decay policy: tick length and per-tick retention factor λ as
// Q0.64 (`decay_per_tick / 2^64`). λ is derived from the human-facing
// half-life by config tooling at policy-authoring time, so no
// transcendental function ever runs in a replica.
message DecayPolicy {
  // Tick length in microseconds. Must be positive.
  int64 tick_us = 1;
  // Per-tick retention factor λ, Q0.64. Bounded above by ADR 0019's
  // iteration limit (λ ≤ 1 − 2⁻¹⁶).
  uint64 decay_per_tick_q0_64 = 2;
}

// A quota entity's usage accumulator: the (accumulated usage, last update)
// pair of ADR 0005. Decay is lazy but exact (integer iterated per-tick
// step); timestamps are proposer-stamped command times, never wall clock.
message UsageState {
  uint64 usage_ucu = 1;
  int64 last_update_us = 2;
}

// The replicated record of a placement charge, kept on the attempt so its
// terminal resolution can true up against what was actually consumed. A
// bounded job is charged once at placement; a job with no declared
// max_runtime is charged in intervals, one up front at placement and one more
// each time its runtime reaches the end of what it has paid for (ADR 0046).
message ChargeRecord {
  // Everything charged to every ancestor so far, µCU: the full job cost for a
  // bounded job, the sum of every interval charged for an unbounded one.
  uint64 amount_ucu = 1;
  // Timestamp of the most recent charge — the placement command, or the
  // latest interval renewal (Unix µs). The true-up's refund decays from here.
  int64 charged_at_us = 2;
  // Parts-per-thousand of the unused charge that true-up refunds, captured
  // at charge time so a mid-flight policy edit never reprices (ADR 0029).
  // Explicit presence: absent decodes to 1000 (full refund) — a charge
  // recorded before ADR 0029 trues up with a full refund, as it did then.
  optional uint32 refund_fraction_milli = 3;
  // Interval charging for a job with no declared max_runtime (ADR 0046).
  // Absent for a bounded job's single up-front charge.
  ChargeInterval interval = 4;
}

// How an unbounded job's runtime is being paid for (ADR 0046): in intervals
// of a fixed length, each charged up front. Captured from policy at
// placement, so a policy edit never re-chunks an in-flight attempt.
message ChargeInterval {
  // Interval length in seconds; must be positive.
  uint64 seconds = 1;
  // Intervals charged so far, placement's included; must be at least 1. The
  // compare-and-set token a RenewIntervalCharges item carries.
  uint32 paid = 2;
  // The amount the most recent charge added, µCU: the placement's one
  // interval at first, then each renewal's tranche. The true-up decays up to
  // this much of the unused charge from ChargeRecord.charged_at_us.
  uint64 last_tranche_ucu = 3;
  // The charge timestamp in force before the most recent charge (Unix µs):
  // equal to ChargeRecord.charged_at_us at placement, then the previous
  // charge's timestamp after each renewal. The true-up decays any unused
  // charge beyond last_tranche_ucu from here.
  int64 prior_charged_at_us = 4;
}

// What an attempt's charge settled to at terminal resolution: the actual
// cost it was priced at and the true-up that closed the gap. Recorded on the
// attempt beside its charge so a job's refund is answerable from state after
// the true-up has been folded into entity usage (ADR 0005/0029).
message Settlement {
  // rate × ceil-seconds(actual runtime) × multiplier, µCU; zero for an
  // attempt that never reached Running.
  uint64 actual_cost_ucu = 1;
  // Exactly one is set; an unset oneof is a decode error.
  oneof true_up {
    // The unused portion of the charge, already decayed from charge time to
    // resolution time, µCU.
    uint64 refund_ucu = 2;
    // Consumption beyond the charge (post-max_runtime kill grace), µCU.
    uint64 surcharge_ucu = 3;
  }
}

// Maps one user-facing priority to its Q32.32 cost multiplier. Part of the
// replicated policy; repeated sorted entries, never a proto map. Canonical
// form: ascending priority, unique priorities.
message PriorityMultiplierEntry {
  sint32 priority = 1;
  uint64 multiplier_q32_32 = 2;
}

// Replicated cluster policy (ADR 0020: never in a node config file —
// everything here would diverge scheduling or accounting if replicas
// disagreed). Human-facing forms (half-lives, rates) are converted by
// tooling before proposal.
message PolicyConfig {
  CostWeights cost_weights = 1;
  DecayPolicy decay = 2;
  // Penalty exponent in milli (2000 = quadratic), applied to the
  // over-quota ratio in *derived* scheduler state only.
  uint32 penalty_exponent_milli = 3;
  // Canonical form: ascending priority, unique priorities.
  repeated PriorityMultiplierEntry priority_multipliers = 4;
  // K: at most this many jobs hold accruing allocations at once (ADR 0014).
  uint32 accrual_limit = 5;
  // Field 6 was default_charge_runtime_s, the synthetic one-off charge
  // runtime for unbounded jobs, replaced by interval charging (ADR 0046).
  reserved 6;
  reserved "default_charge_runtime_s";
  // Terminal jobs are eligible for eviction this long after terminal state
  // (ADR 0012). Consulted by the proposer, never by apply.
  int64 terminal_retention_us = 7;
  // Default SIGTERM→SIGKILL grace for aborts, microseconds.
  int64 abort_grace_us = 8;
  // Q32.32 multiplier folded into a job's effective priority multiplier when
  // it declares no enforced max_runtime, pricing unbounded jobs at an
  // elevated rate (ADR 0029). Explicit presence: absent decodes to the
  // neutral 2^32 (i.e. 1.0), so a policy written by a pre-0029 coordinator
  // round-trips to the old behaviour.
  optional uint64 unbounded_runtime_multiplier_q32_32 = 9;
  // Parts-per-thousand of a bounded job's unused charge that true-up refunds
  // (ADR 0029); the remainder stays in decayed usage as the cost of
  // overdeclaration. Explicit presence: absent decodes to the neutral 1000
  // (full refund), so a pre-0029 policy round-trips to the old behaviour.
  optional uint32 refund_fraction_milli = 10;
  // Name of the token claim carrying a principal's groups (ADR 0022/0023).
  // Replicated policy, not node config: two replicas reading different claim
  // names would disagree about authority. Explicit presence, following the
  // documented-default convention of fields 9 and 10: absent decodes to
  // "groups".
  optional string groups_claim = 11;
  // A node record that no longer accepts placements and holds no live
  // allocation is eligible for eviction this long after the leader last
  // heard from it (ADR 0041). Consulted by the proposer, never by apply.
  // Explicit presence, following fields 9–11: absent decodes to 24 h.
  optional int64 node_retention_us = 12;
  // Length of the intervals a job with no enforced max_runtime is charged
  // in, seconds (ADR 0046). Validated > 0 at policy commit. Explicit
  // presence, following fields 9–12: absent decodes to 1800 (30 minutes).
  optional uint64 unbounded_charge_interval_s = 13;
  // Q32.32 multiplier folded into the charge multiplier of an effectively
  // preemptible attempt at placement (ADR 0044 §1), the preemptibility
  // discount. Validated ≤ 2^32 (1.0) at policy commit. Explicit presence:
  // absent decodes to the default 0.75 (3 · 2^30).
  optional uint64 preemptible_multiplier_q32_32 = 14;
  // Bounds on a job's declared preemption notice, microseconds
  // (ADR 0044 §1): `floor ≤ notice ≤ cap`, and a job that declares none is
  // given the floor. Validated floor ≤ cap at policy commit. Explicit
  // presence: absent decodes to 60 s and 5 min.
  optional int64 preemption_notice_floor_us = 15;
  optional int64 preemption_notice_cap_us = 16;
}
