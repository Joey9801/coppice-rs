// The membership admin surface (ADR 0016): thin RPC wrappers over the
// Consensus trait — add a learner, promote it to voter (with the optional
// joint removal of a departed voter), remove a node — plus a status RPC
// operators and integration tests poll for leader identity, applied
// progress, membership, and per-follower replication lag.
//
// Like the transport, every request stamps the ADR 0016 cluster identity in
// tag 1 and the channel is mutually authenticated TLS (ADR 0011). Node ids
// are allocate-once u64 Raft coordinator identities (ADR 0016), never
// coppice.core.v1.NodeId compute-node ids.

syntax = "proto3";

package coppice.raft.v1;

import "coppice/core/v1/ids.proto";
import "coppice/core/v1/job.proto";
import "coppice/core/v1/pki.proto";
import "coppice/core/v1/resource.proto";
import "coppice/raft/v1/raft.proto";

// Add a coordinator to membership as a non-voting learner so it can catch
// up on the log before any voter change (ADR 0016 step 1).
message AddLearnerRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  uint64 node_id = 8;
  string address = 9; // the address peers dial to reach it.
}

message AddLearnerResponse {}

// Promote a caught-up learner to voter (ADR 0016 step 3, ADR 0037 §7).
//
// The caller never names a removal. A promotion that would exceed
// `cluster_size` folds in the removal of at most one *evidence-dead* voter,
// chosen by the leader from its own replication observation (ADR 0037 §7
// "the hands-off path"); a caller-named pair is the operator-only
// ReplaceVoter below. Field 9 carried the old caller-named `remove_node_id`
// and is reserved: §7 admits no other shrink path.
message PromoteVoterRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  uint64 promote_node_id = 8;
  reserved 9;
  reserved "remove_node_id";
}

message PromoteVoterResponse {}

// Replace one voter with another in a single joint change (ADR 0037 §7).
//
// The operator-authenticated verb for launch-before-terminate replacement:
// `new_node_id` is a caught-up learner that has confirmed durable receipt of
// the CA key (§4), `old_node_id` is the voter it takes over from — alive or
// not. Promotion and removal commit atomically, so the voter count never
// overshoots and quorum among survivors holds throughout. Idempotent per §6:
// `new` already a voter and `old` gone entirely is a no-op success.
message ReplaceVoterRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  uint64 old_node_id = 8;
  uint64 new_node_id = 9;
}

message ReplaceVoterResponse {}

// Push the CA private key from the leader to a promotion candidate
// (ADR 0037 §4), on the mutually-authenticated admin channel and nowhere
// else: the key never enters replicated state, a snapshot, or a log.
//
// The candidate verifies the key against the CA certificate it already
// replicates, persists it owner-only and durably, and acknowledges; the
// leader then records the *fact* of possession as a replicated
// ConfirmKeyPossession. Idempotent: a candidate that already holds a valid
// matching key acknowledges without rewriting.
message TransferCaKeyRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  // PEM of the cluster CA private key. Root-equivalent material: never
  // logged, never echoed, never persisted anywhere but the recipient's own
  // owner-only key file.
  bytes ca_key_pem = 8;
}

message TransferCaKeyResponse {}

// Remove a node from membership entirely.
message RemoveNodeRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  uint64 node_id = 8;
}

message RemoveNodeResponse {}

// Repoint a member's dial address (ADR 0037 §6). Operator-credential
// break-glass only; the leader dial-back-verifies the new address before
// committing. There is no self-service address repair.
message SetNodeAddressRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  uint64 node_id = 8;
  string address = 9;
}

message SetNodeAddressResponse {}

// Poll a coordinator for its view of cluster state.
message ClusterStatusRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
}

// A coordinator's answer to ClusterStatus. The replication list is populated
// only when the responder is the leader; it is empty everywhere else.
message ClusterStatusResponse {
  uint64 local_node_id = 1;
  optional uint64 leader_node_id = 2; // absent = no leader currently known.
  uint64 term = 3;
  uint64 last_applied_index = 4;
  uint64 known_committed_index = 5;
  Membership membership = 6;
  repeated ReplicationProgress replication = 7; // leader only; empty elsewhere.
  repeated MachineBinding bindings = 8; // as surfaced by `admin status --json`.
  // The cluster-redundancy verdict (ADR 0037 §9) — the same leader-only
  // stability-window answer `?require=healthy` gives. Absent when this
  // responder cannot answer authoritatively (a follower, or an unformed
  // daemon): unknown health is not health, and it is never faked or cached.
  ClusterHealth health = 9;
  // Every node that has ever confirmed durable receipt of the CA key
  // (ADR 0037 §4) — voters, keyed-but-never-promoted candidates, and
  // departed seats alike. The §4 abandoned-candidate case is visible here
  // and nowhere else: every disk that received the key is root-equivalent.
  repeated KeyHolder key_holders = 10;
  // Unresolved key-transfer intents (ADR 0037 §4): the leader committed its
  // intent to transfer the CA key to these nodes, and no confirmation has
  // resolved it — a crash between the candidate's durable receipt and the
  // replicated confirmation lands here. Conservative by design: such a disk
  // MAY hold the key, so custody accounting treats it as if it does until a
  // retried transfer confirms.
  repeated PendingKeyTransfer pending_key_transfers = 11;
}

// One node's confirmed CA-key possession (ADR 0037 §4). The fact only —
// possession is replicated, the key never is.
message KeyHolder {
  uint64 node_id = 1;
  int64 confirmed_at_us = 2;
}

// One node's unresolved key-transfer intent (ADR 0037 §4): committed before
// the key ever leaves the leader's disk, resolved by the confirmation.
message PendingKeyTransfer {
  uint64 node_id = 1;
  int64 intended_at_us = 2;
}

// The leader's cluster-redundancy verdict (ADR 0037 §9): whether at least
// `cluster_size` voters have replicated within the promotion-lag threshold,
// sustained for the configured stability interval.
message ClusterHealth {
  bool healthy = 1;
  // Voters the leader currently observes within the lag threshold
  // (including itself).
  uint64 live_voters = 2;
}

// One replicated machine-identity <-> seat binding (ADR 0037 §7), as
// surfaced by `admin status --json`.
message MachineBinding {
  string machine_id = 1;
  uint64 node_id = 2;
  string address = 3;
  int64 bound_at_us = 4;
}

// One follower's replication progress as the leader tracks it.
message ReplicationProgress {
  uint64 node_id = 1;
  uint64 matched_index = 2;
}

// Ask a discovered candidate what it is (ADR 0037 §3).
//
// The one verb a converging coordinator can issue before it knows anything
// about the cluster it is looking for: it stamps the operator-chosen logical
// `cluster_id` from config (ADR 0020) rather than a history id, because a
// fresh daemon has no stamp of its own yet. The answer decides everything
// that follows — join an initialized cluster, park, or (for `init`) refuse
// to form a second one.
message ProbeClusterRequest {
  // The logical cluster name this prober intends to reach (ADR 0020),
  // identical across a fleet's config. Tag 1 carries cluster identity on
  // this plane exactly as `history_id` does on the other verbs.
  string cluster_id = 1;
}

// One voter in a probe answer: enough to dial it.
message ProbeVoter {
  uint64 node_id = 1;
  string address = 2;
}

// A candidate's answer to ProbeCluster.
//
// `initialized` is the load-bearing field and it is deliberately narrow: it
// is true only once the responder carries the local `formation_complete`
// marker (ADR 0037 §3). A daemon that is parked, mid-formation, or in
// `formation-failed` answers false, which is what confines a failed
// formation to the one node that attempted it.
message ProbeClusterResponse {
  // The responder's own configured cluster id; a prober compares it with
  // its own before treating the rest of the answer as relevant.
  string cluster_id = 1;
  // The responder's stamped history id (ADR 0037 §3), empty when it has no
  // manifest yet. Names the raft history, not the logical cluster.
  bytes history_id = 2;
  // True only when this responder is serving a formed cluster.
  bool initialized = 8;
  // The responder's raft identity; absent until its directory is stamped.
  optional uint64 node_id = 9;
  // The leader the responder last saw, for a prober choosing whom to ask
  // next; absent when unknown or uninitialized.
  optional uint64 leader_hint = 10;
  // Current voters, ascending by node_id; empty when uninitialized.
  repeated ProbeVoter voters = 11;
}

// The membership admin surface (ADR 0016), served over mTLS (ADR 0011).
service RaftAdminService {
  rpc AddLearner(AddLearnerRequest) returns (AddLearnerResponse);
  rpc PromoteVoter(PromoteVoterRequest) returns (PromoteVoterResponse);
  // Replace one voter with another atomically (ADR 0037 §7). Operator-only:
  // a machine credential can never remove, replace, repoint, or initialize.
  rpc ReplaceVoter(ReplaceVoterRequest) returns (ReplaceVoterResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  // Leader → promotion candidate CA-key push (ADR 0037 §4), the one carrier
  // of the key between disks. Served by every coordinator; the candidate
  // side is what persists the key.
  rpc TransferCaKey(TransferCaKeyRequest) returns (TransferCaKeyResponse);
  // Repoint a member's dial address (ADR 0037 §6). Operator-credential
  // break-glass only; the leader dial-back-verifies the new address before
  // committing. There is no self-service address repair.
  rpc SetNodeAddress(SetNodeAddressRequest) returns (SetNodeAddressResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  // Answered in every daemon state, including parked and formation-failed
  // (ADR 0037 §3) — the one verb that is not gated on a formed cluster.
  rpc ProbeCluster(ProbeClusterRequest) returns (ProbeClusterResponse);

  // Enrollment-token and identity administration (ADR 0037 §5), plus the
  // leader-side halves of enrollment and coordinator renewal (§4). Every one
  // is leader-only and served only once the cluster is formed.
  rpc MintEnrollToken(MintEnrollTokenRequest) returns (MintEnrollTokenResponse);
  rpc ListEnrollTokens(ListEnrollTokensRequest) returns (ListEnrollTokensResponse);
  rpc RevokeEnrollToken(RevokeEnrollTokenRequest) returns (RevokeEnrollTokenResponse);
  rpc RevokeIdentity(RevokeIdentityRequest) returns (RevokeIdentityResponse);
  // A follower's internal proxy of `POST /api/v1/enroll` — never a redirect
  // to a token-carrying client (ADR 0037 §4).
  rpc ForwardEnroll(ForwardEnrollRequest) returns (ForwardEnrollResponse);
  // Re-issue the caller's own coordinator leaf, authenticated by the current
  // leaf it presented (ADR 0037 §4 renewal).
  rpc RenewCoordinator(RenewCoordinatorRequest) returns (RenewCoordinatorResponse);

  // A follower's internal forwarding of the three client writes to the
  // leader (ADR 0038), generalizing ForwardEnroll above. Each carries the
  // request at the *control-plane* level, never a pre-encoded log command:
  // the leader re-runs the whole write path — shape validation, the
  // replicated multiplier lookup against its own view, its own timestamp,
  // and the propose — exactly as it would for a direct client.
  //
  // Single hop by construction: a receiver that is not the leader answers
  // with the NotLeader outcome rather than forwarding again.
  rpc ForwardSubmitJob(ForwardSubmitJobRequest) returns (ForwardSubmitJobResponse);
  rpc ForwardAbortJob(ForwardAbortJobRequest) returns (ForwardAbortJobResponse);
  rpc ForwardConfigureQuotaEntity(ForwardConfigureQuotaEntityRequest)
      returns (ForwardConfigureQuotaEntityResponse);
}

// ---- Enrollment tokens and identity revocation (ADR 0037 §5) -------------

// Mint an enrollment token for one role. The secret is generated on the
// leader, hashed into replicated policy, and returned in the response
// EXACTLY ONCE — it is not recoverable afterwards and must never be logged.
message MintEnrollTokenRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  coppice.core.v1.EnrollRole role = 8;
  // A human label, unique per live token by convention; it is what
  // `[[enroll_token]]` policy seeding keys idempotency on.
  string label = 9;
  // Time-to-live in seconds; absent = a token that never expires (the
  // supported launch-template default, ADR 0037 §5).
  optional uint64 ttl_seconds = 10;
}

message MintEnrollTokenResponse {
  coppice.core.v1.EnrollTokenId token_id = 1;
  // The bearer secret, returned once and never stored in the clear.
  string secret = 2;
  optional int64 expires_at_us = 3;
}

message ListEnrollTokensRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
}

// One listed token. Deliberately carries NO hash: listing is an operator
// inventory, not a credential export.
message EnrollTokenSummary {
  coppice.core.v1.EnrollTokenId token_id = 1;
  coppice.core.v1.EnrollRole role = 2;
  string label = 3;
  int64 minted_at_us = 4;
  optional int64 expires_at_us = 5;
  bool revoked = 6;
}

message ListEnrollTokensResponse {
  repeated EnrollTokenSummary tokens = 1; // ascending by token id.
}

message RevokeEnrollTokenRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  coppice.core.v1.EnrollTokenId token_id = 8;
}

message RevokeEnrollTokenResponse {}

// Mark an issued identity revoked: the leader then refuses its renewals,
// which with short leaf lifetimes is v1's revocation mechanism (ADR 0037 §5).
message RevokeIdentityRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  coppice.core.v1.RevokedIdentity identity = 8;
}

message RevokeIdentityResponse {}

// ---- Enrollment and renewal (ADR 0037 §4) --------------------------------

// A follower's proxy of an enrollment request to the leader, where the CA key
// lives. `token` is the enrollee's bearer secret in transit on an already
// mutually-authenticated channel; like every other carrier of it, it must
// never be logged.
message ForwardEnrollRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  string token = 8;
  string csr_pem = 9;
  // The identity the enrollee claims: a node id for the agent role, a
  // self-minted machine id for the coordinator role. The token's role decides
  // which is required.
  optional coppice.core.v1.NodeId node_id = 10;
  optional coppice.core.v1.MachineId machine_id = 11;
  // The hostnames/IPs the enrollee will SERVE on, carried into the issued
  // leaf as SANs. Metadata, never identity (ADR 0037 §4): the subject is
  // dictated by the cluster from node_id/machine_id, and what makes a
  // declared address trustworthy is the leader's dial-back verification at
  // admission (§6), not this field. An enrollee that serves nothing — an
  // agent behind an outbound-only session — sends none.
  repeated string sans = 12;
}

message ForwardEnrollResponse {
  string cert_pem = 1;
  string ca_pem = 2;
}

// Renew the caller's own coordinator leaf. There is no subject field by
// design: the subject comes from the verified client certificate the request
// arrived on, so renewal cannot change identity (ADR 0037 §4).
message RenewCoordinatorRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  string csr_pem = 8;
  // As ForwardEnrollRequest.sans: the addresses this coordinator serves on,
  // re-declared each renewal so a re-addressed node's next leaf follows it.
  repeated string sans = 9;
}

message RenewCoordinatorResponse {
  string cert_pem = 1;
  string ca_pem = 2;
}

// ---- Forwarded client writes (ADR 0038) ---------------------------------

// The outcome of one forwarded client write.
//
// Reported in the response body rather than as a gRPC status because the
// originating follower has to tell four things apart that no status code
// distinguishes reliably: committed-and-applied, committed-and-refused (a
// 409 the client must see), "you asked the wrong replica" (the follower's
// own 421), and a request that never resolved at all. Only the last is a
// gRPC error here; the first three are answers.
//
// A rich enum is a oneof with a message per arm, empty ones included, per
// the house style.
message ForwardWriteOutcome {
  // Committed and applied. `log_index` is the apply index, which the
  // follower hands back to the client for read-your-writes (ADR 0007).
  message Applied {
    uint64 log_index = 1;
  }
  // Committed, and apply refused it deterministically — a normal race
  // outcome, not a fault. `reason` is the leader's *rendered*
  // RejectionReason: the type has no proto encoding, and the client only
  // ever sees the rendered text anyway (ADR 0038).
  message Rejected {
    string reason = 1;
  }
  // The receiver is not the leader (the forwarder's view was stale, or
  // leadership moved under it). It never forwards again — the originating
  // follower answers the client with its ordinary not-leader refusal.
  message NotLeader {}
  // Refused by synchronous validation before anything was proposed; the
  // client must fix the request, and retrying it as-is cannot help.
  message Invalid {
    string message = 1;
  }

  oneof outcome {
    Applied applied = 1;
    Rejected rejected = 2;
    NotLeader not_leader = 3;
    Invalid invalid = 4;
  }
}

// A follower's forwarding of `POST /api/v1/jobs`. Mirrors the JSON write
// body field for field, deliberately: what crosses the hop is the client's
// request, not a decision derived from it.
message ForwardSubmitJobRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  // Client-minted job identity (ADR 0024), and the submission's idempotency
  // identity (ADR 0026): it is what makes retrying an unknown forwarding
  // outcome safe.
  coppice.core.v1.JobId job = 8;
  string image = 9;
  // Required non-empty, enforced by the leader (Job.command's rule).
  repeated string command = 10;
  // Absent runs the image's own entrypoint; present must be non-empty.
  coppice.core.v1.Entrypoint entrypoint = 11;
  coppice.core.v1.Resources requests = 12;
  // Raw, as the client sent it: the leader resolves it through *its own*
  // view of the replicated multiplier table (ADR 0019), and a priority with
  // no configured multiplier is invalid there, not here.
  sint32 priority = 13;
  // Whole seconds, as the JSON body spells it, not the domain's µs: the
  // range check belongs to the leader's validation, so the value it checks
  // must be the one the client wrote.
  optional int64 max_runtime_seconds = 14;
  coppice.core.v1.QuotaEntityId quota_entity = 15;
  // Absent = the platform default policy.
  coppice.core.v1.RetryPolicy retry = 16;
}

message ForwardSubmitJobResponse {
  ForwardWriteOutcome outcome = 1;
}

// A follower's forwarding of `POST /api/v1/jobs/{job}/abort`. The job id is
// the one the HTTP layer already resolved from the path.
message ForwardAbortJobRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  coppice.core.v1.JobId job = 8;
  optional string reason = 9;
}

message ForwardAbortJobResponse {
  ForwardWriteOutcome outcome = 1;
}

// A follower's forwarding of `POST /api/v1/quota-entities`.
message ForwardConfigureQuotaEntityRequest {
  bytes history_id = 1; // 16-byte stamped history id (ADR 0016, ADR 0037 §3).
  // Client-minted (ADR 0024/0026), and the upsert target: an existing id
  // updates, a fresh one creates.
  coppice.core.v1.QuotaEntityId entity = 8;
  // Absent roots the entity. A missing or cycle-forming parent is rejected
  // at apply, and comes back as the Rejected outcome above.
  optional coppice.core.v1.QuotaEntityId parent = 9;
  string name = 10;
  uint64 quota_ucu = 11; // soft quota as a stock in µCU (ADR 0019).
}

message ForwardConfigureQuotaEntityResponse {
  ForwardWriteOutcome outcome = 1;
}
